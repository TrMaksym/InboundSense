name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inboundsense_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d inboundsense_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: inboundsense_db
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/inboundsense_db
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_URL: redis://localhost:6379/0
      ENVIRONMENT: test
      FASTEMBED_CACHE_PATH: /tmp/fastembed_cache

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip -q
          python -m pip install "poetry>=2.0,<3" -q
          poetry config virtualenvs.create false

      - name: Check lock file is in sync
        run: poetry check --lock

      - name: Install dependencies
        run: |
          poetry install --no-root --without train --no-interaction
          pip install pytest pytest-asyncio pytest-cov

      - name: Cache fastembed models
        uses: actions/cache@v4
        with:
          path: /tmp/fastembed_cache
          key: fastembed-${{ runner.os }}-v1

      - name: Run database migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -v --cov=app --cov-report=term-missing