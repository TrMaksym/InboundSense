[project]
name = "inboundsense"
version = "0.1.0"
description = "Async NLP processing pipeline for inbound communications"
authors = [
    {name = "Maxim", email = "maximuschampion2002@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<3.16"
dependencies = [
    "fastapi (>=0.143.1,<0.144.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "pydantic-settings (>=2.16.0,<3.0.0)",
    "sqlalchemy (>=2.0)",
    "asyncpg (>=0.32.0,<0.33.0)",
    "pgvector (>=0.5.1,<0.6.0)",
    "fastembed (>=0.9.0,<0.10.0)",
    "greenlet (>=3.5.6,<4.0.0)",
    "celery (>=5.6.3,<6.0.0)",
    "redis (>=8.1.0,<9.0.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "selectolax (>=1.0.0,<2.0.0)",
    "pandas (>=3.0.6,<4.0.0)",
    "onnxruntime (>=1.20.0,<2.0.0)",
    "tokenizers (>=0.22.0,<=0.23.0)",
    "transformers (>=4.38.0,<5.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = ">=9.1.1,<10.0.0"
pytest-asyncio = ">=1.4.0,<2.0.0"
pytest-cov = ">=7.1.0,<8.0.0"

[tool.poetry.group.train]
optional = true

[tool.poetry]
package-mode = false

[tool.poetry.group.train.dependencies]
torch = ">=2.1.0,<3.0.0"
accelerate = ">=1.1.0"
onnx = ">=1.16.0,<2.0.0"
onnxscript = ">=0.1.0,<1.0.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]